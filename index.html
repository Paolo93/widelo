<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Cinematic Narrative Engine</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: black;
  font-family: Arial;
  overflow-x: hidden;
}

/* SCENY */
.scene {
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* VIDEO */
video {
  position: absolute;
  inset: 0;
  margin: auto;

  max-width: 100%;
  max-height: 100%;

  width: auto;
  height: auto;

  object-fit: contain;
  background: black;
  filter: blur(8px);
  transform: scale(1.05);
}

/* DARK CINEMA LAYER */
.scene::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(0,0,0,0.2), rgba(0,0,0,0.92));
  z-index: 1;
}

/* CONTENT */
.content {
  position: relative;
  z-index: 2;
  color: white;
  text-align: center;
  max-width: 700px;
  opacity: 0;
  transform: translateY(40px);
}

h1 { font-size: 40px; margin-bottom: 10px; }
p { opacity: 0.8; }

/* CHAPTER */
.chapter {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 46px;
  letter-spacing: 3px;
}

/* CHOICES */
.choices {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

button {
  padding: 10px 15px;
  border: none;
  cursor: pointer;
  background: white;
  color: black;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- SCENA 1 -->
<section class="scene" data-scene="1">
  <video muted playsinline>
    <source src="film1.mp4">
  </video>

  <div class="content">
    <h1>Nie wszystko jest tym, czym się wydaje</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>
</section>

<div class="chapter">CHAPTER I — AWAKENING</div>

<!-- SCENA 2 -->
<section class="scene" data-scene="2">
  <video muted playsinline>
    <source src="film2.mp4">
  </video>

  <div class="content">
    <h1>Słyszysz to?</h1>
    <p>Lorem ipsum dolor sit amet, sed do eiusmod tempor.</p>
  </div>
</section>

<div class="chapter">CHAPTER II — SIGNAL</div>

<!-- SCENA 3 -->
<section class="scene" data-scene="3">
  <video muted playsinline>
    <source src="film3.mp4">
  </video>

  <div class="content">
    <h1>Teraz już wiesz</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </div>
</section>

<script>
gsap.registerPlugin(ScrollTrigger);

/* 🎧 AUDIO (placeholder) */
const audio = new Audio();
audio.src = ""; // możesz tu dać ambient.mp3
audio.loop = true;

/* STATE */
let storyState = {
  choice: null
};

/* SCENY */
document.querySelectorAll(".scene").forEach(scene => {
  const video = scene.querySelector("video");
  const content = scene.querySelector(".content");

  if (video) video.load();

  ScrollTrigger.create({
    trigger: scene,
    start: "top center",
    end: "bottom center",

    onEnter: () => activate(scene, video, content),
    onEnterBack: () => activate(scene, video, content)
  });
});

function activate(scene, video, content) {

  // reset videos
  document.querySelectorAll("video").forEach(v => {
    v.pause();
    v.currentTime = 0;
    v.style.filter = "blur(10px)";
  });

  if (video) {
    video.play().catch(()=>{});

    gsap.to(video, {
      filter: "blur(0px)",
      duration: 1.2
    });
  }

  gsap.to(content, {
    opacity: 1,
    y: 0,
    duration: 0.8
  });

  // audio start (jeśli dodasz)
  if (audio.src) audio.play();
}

</script>

</body>
</html>
